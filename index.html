<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lire Lacan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1712; --ink-soft: #4a4640; --ink-faint: #8a857e;
      --paper: #f5f0e8; --paper-warm: #ede7d8; --paper-dark: #ddd5c5;
      --accent: #6b3a2a; --accent-light: #c4785a; --accent-pale: #f0e0d6;
      --border: rgba(26,23,18,0.12); --border-strong: rgba(26,23,18,0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Karla', sans-serif;
      font-weight: 300;
      line-height: 1.7;
    }
    #root { min-height: 100vh; }
  </style>
</head>

  <div id="root"></div>
